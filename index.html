<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vistara Download</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 55px 20px 35px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: white;
      color: #111;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 48px;
    }

    header p {
      color: #999;
    }

    .container {
      width: min(700px, calc(100% - 30px));
      margin: auto;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 25px;
      padding: 30px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #999;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 18px;
      margin-top: 15px;
      border-radius: 14px;
      border: 1px solid #333;
      background: #090909;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: white;
    }

    button {
      width: 100%;
      margin-top: 13px;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.97);
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 16px;
      background: #202020;
      border: 1px solid #333;
    }

    #result h3 {
      margin-top: 0;
    }

    .download-button {
      background: #35d07f;
      color: #07130c;
    }

    .platforms {
      margin-top: 30px;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .platform {
      padding: 13px 8px;
      text-align: center;
      border-radius: 12px;
      background: #202020;
      color: #aaa;
      font-size: 13px;
    }

    .note {
      margin-top: 25px;
      color: #777;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #555;
      font-size: 12px;
      padding: 30px;
    }

    @media (max-width: 520px) {
      h1 {
        font-size: 40px;
      }

      .card {
        padding: 22px;
      }

      .platform-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">V</div>
  <h1>Vistara</h1>
  <p>Simple. Fast. Beautiful.</p>
</header>

<main class="container">

  <section class="card">

    <h2>Download Media</h2>

    <p class="subtitle">
      Paste a supported media link below.
    </p>

    <input
      type="url"
      id="mediaUrl"
      placeholder="Paste your media link here..."
    >

    <button onclick="getMedia()">
      Get Media
    </button>

    <div id="result">
      <h3 id="resultTitle"></h3>
      <p id="resultMessage"></p>

      <button class="download-button" onclick="downloadMedia()">
        Download Media
      </button>
    </div>

    <div class="platforms">
      <strong>Supported platforms</strong>

      <div class="platform-grid">
        <div class="platform">Facebook</div>
        <div class="platform">TikTok</div>
        <div class="platform">Instagram</div>
        <div class="platform">RedNote</div>
        <div class="platform">Snapchat</div>
        <div class="platform">X</div>
      </div>
    </div>

    <p class="note">
      Only download media you have permission to use.
    </p>

  </section>

</main>

<footer>
  © 2026 Vistara Download
</footer>

<script>
  let currentUrl = "";

  async function getMedia() {
    const input = document.getElementById("mediaUrl");
    const url = input.value.trim();

    if (!url) {
      alert("Please paste a media link first.");
      return;
    }

    try {
      const response = await fetch("/api/download", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ url: url })
      });

      const data = await response.json();

      if (!response.ok) {
        alert(data.error || "Something went wrong.");
        return;
      }

      currentUrl = data.url;

      document.getElementById("resultTitle").textContent =
        data.platform + " detected ✓";

      document.getElementById("resultMessage").textContent =
        data.message;

      document.getElementById("result").style.display = "block";

    } catch (error) {
      alert("Could not connect to the server.");
    }
  }

  function downloadMedia() {
    alert(
      "The media download service is not connected yet. " +
      "The link has been successfully detected."
    );
  }
</script>

</body>
</html>
