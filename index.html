<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vistara Download</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      background: #111;
      color: white;
      padding: 30px 15px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    input {
      width: 90%;
      max-width: 600px;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 15px 30px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    .platforms {
      margin-top: 35px;
      line-height: 2;
      font-size: 16px;
    }

    .note {
      color: #666;
      font-size: 14px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Vistara Download</h1>
    <p>Fast & simple media downloads</p>
  </header>

  <main class="container">
    <h2>Download Media</h2>

    <input
      type="url"
      placeholder="Paste a supported video or media link"
      aria-label="Media URL"
    >

    <br>

   <button onclick="getMedia()">

    <div class="platforms">
      <strong>Supported platforms</strong><br>
      Facebook • TikTok • Instagram • RedNote<br>
      Snapchat • X (Twitter) • Other supported platforms
    </div>

    <p class="note">
      Videos • Reels • Stories • Photos • High quality where available
    </p>
  </main>
<script>
async function getMedia() {
  const input = document.querySelector('input[type="url"]');
  const url = input.value.trim();

  if (!url) {
    alert("Please enter a link first.");
    return;
  }

  try {
    const response = await fetch("/api/download", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url: url })
    });

    const data = await response.json();

    alert(data.message || "Link received successfully!");
  } catch (error) {
    alert("Could not connect to the server.");
  }
}
</script>
</body>
</html>
